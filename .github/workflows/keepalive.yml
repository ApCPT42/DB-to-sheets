# Penjaga jadwal: GitHub mematikan workflow terjadwal secara diam-diam di repo
# publik yang tidak punya aktivitas commit selama 60 hari. Repo ini memang jarang
# berubah, jadi tanpa penjaga ini permintaan client akan berhenti dilayani tanpa
# ada yang menyadarinya sampai ada yang mengeluh.
#
# Cara kerjanya: dua kali sebulan ia membuat commit kosong. Commit kosong tetap
# tercatat sebagai aktivitas repo, jadi penghitung 60 hari itu kembali ke nol.
# Dijalankan tanggal 1 dan 15 supaya satu putaran yang gagal tidak langsung
# melewati batas — dua belas commit setahun adalah harga yang murah.
#
# Catatan jujur: GitHub tidak menjanjikan bahwa commit dari bot ini menghitung
# sebagai aktivitas. Kalau ternyata tidak, GitHub akan mengirim email bahwa
# jadwalnya dimatikan dan ada tombol *Enable workflow* sekali klik di tab
# Actions — jadi kegagalannya terlihat, bukan senyap.

name: Jaga jadwal ekspor tetap hidup

on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

# Perlu izin menulis karena satu-satunya tugasnya membuat commit.
permissions:
  contents: write

jobs:
  sentuh-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Buat commit kosong
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Jaga jadwal ekspor tetap aktif"
          git push
