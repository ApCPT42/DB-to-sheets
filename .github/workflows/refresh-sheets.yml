# Pengawas ekspor yang berjalan terjadwal di GitHub Actions.
#
# Kenapa di sini: ini jalan gratis yang tidak meminta kartu sama sekali —
# platform yang menyediakan proses selalu-nyala (Northflank, Koyeb, Fly, Oracle,
# GCP) semuanya meminta metode pembayaran. Pengawas ini hanya *keluar*
# menghubungi Google dan Aiven, jadi pola terjadwal seperti ini justru cocok.
#
# Cara kerjanya: setiap jadwal, runner memanggil skrip dengan `--if-requested`.
# Skrip memeriksa satu sel di tab Kontrol; kalau dicentang ia mengekspor lalu
# keluar, kalau tidak ia keluar tanpa menyentuh Google Sheets. Jadi centangan
# client terlayani tanpa komputer siapa pun menyala.
#
# Yang perlu disiapkan sekali, di Settings -> Secrets and variables -> Actions:
#   DATABASE_URL                 - koneksi PostgreSQL (boleh pengguna read-only)
#   GOOGLE_SPREADSHEET_ID        - ID atau tautan spreadsheet tujuan
#   GOOGLE_SERVICE_ACCOUNT_JSON  - seluruh isi berkas service-account.json
#
# Jeda minimum cron GitHub adalah 5 menit dan jadwalnya bisa terlambat saat
# servernya sibuk, jadi anggap waktu pelayanan 5-15 menit — bukan 60 detik
# seperti pengawas `--watch`. Menit ke-3 dipakai, bukan menit ke-0, karena beban
# puncak justru di awal jam.
#
# Menit gratis Actions tidak terbatas selama repo ini publik. Kalau repo
# dijadikan privat, jatahnya 2.000 menit/bulan dan jadwal setiap 5 menit akan
# menghabiskannya — ubah saja menjadi tiap 30 menit kalau itu terjadi.

name: Ekspor ke Google Sheets

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

# Hanya perlu membaca repo ini; rahasianya datang dari Secrets.
permissions:
  contents: read

# Satu putaran tidak boleh bertumpuk dengan putaran berikutnya, karena ekspor
# menulis ke spreadsheet yang sama. Dibiarkan menunggu, bukan dibatalkan:
# membatalkan di tengah jalan bisa meninggalkan status "Sedang memproses".
concurrency:
  group: ekspor-sheets
  cancel-in-progress: false

jobs:
  layani-permintaan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-export.txt

      - name: Pasang dependensi
        run: python -m pip install --disable-pip-version-check -r tools/requirements-export.txt

      - name: Layani permintaan kalau ada
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          hilang=""
          [ -z "$DATABASE_URL" ] && hilang="$hilang DATABASE_URL"
          [ -z "$GOOGLE_SPREADSHEET_ID" ] && hilang="$hilang GOOGLE_SPREADSHEET_ID"
          [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && hilang="$hilang GOOGLE_SERVICE_ACCOUNT_JSON"

          if [ -n "$hilang" ]; then
            echo "::warning::Rahasia belum lengkap di Settings -> Secrets and variables -> Actions.$hilang"
            echo "Belum diisi:$hilang"
            echo "Jadwal ini sengaja keluar dengan status sukses supaya tidak"
            echo "mengirim email gagal setiap lima menit. Skrip tidak dijalankan,"
            echo "jadi tidak ada yang disentuh."
            exit 0
          fi

          python tools/export_to_google_sheets.py --if-requested
